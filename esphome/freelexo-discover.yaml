# Freelexo mower - step 1: discover the GATT profile
#
# auto_connect is off on purpose: attach the log first, then press "Connect".
# That way the whole connection handshake and the GATT discovery happen while
# you are watching, instead of seconds before the log client attaches.
#
# The ble_client component prints every service and characteristic it finds:
#
#   [I][ble_client:143]: Service UUID: 0xFFE0
#   [I][ble_client:144]:   start_handle: 0x23  end_handle: 0x26
#   [I][ble_client:305]:  characteristic 0xFFE1, handle 0x25, properties 0x10
#
# IMPORTANT: only one BLE connection is possible. Close the Einhell app and
# stop the Home Assistant integration while this runs.

substitutions:
  name: mower-proxy
  friendly_name: Mower Proxy
  mower_mac: "45:49:4E:00:40:BC"   # <- your mower

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  logs:
    ble_client: VERY_VERBOSE
    esp32_ble_client: VERY_VERBOSE
    esp32_ble_tracker: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    # not continuous, so a manual connect does not have to stop the scanner
    continuous: false
    # the mower is a battery device, do not hammer it
    active: false

ble_client:
  - mac_address: ${mower_mac}
    id: mower
    auto_connect: false
    on_connect:
      then:
        - logger.log:
            format: "MOWER CONNECTED - GATT tree follows below"
            level: WARN
    on_disconnect:
      then:
        - logger.log:
            format: "MOWER DISCONNECTED"
            level: WARN

button:
  - platform: template
    name: "Connect"
    icon: mdi:bluetooth-connect
    on_press:
      - lambda: ESP_LOGW("mower", "connecting to ${mower_mac} ...");
      - ble_client.connect: mower

  - platform: template
    name: "Disconnect"
    icon: mdi:bluetooth-off
    on_press:
      - ble_client.disconnect: mower

  - platform: restart
    name: "Restart"
    icon: mdi:restart
