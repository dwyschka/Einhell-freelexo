# Freelexo mower - send commands from ESPHome
#
# GATT profile discovered on 2026-10-25:
#   service 49535343-FE7D-4AE5-8FA9-9FAFD205E455   (Microchip/ISSC transparent UART)
#   MTU 247
#
# The mower speaks a plain transparent serial link, so the frames below go
# through verbatim.
#
# What this can do: every command is fire-and-forget from the app's point of
# view (its ControlMessage is literally named that), so start, pause, dock,
# edge cutting and clock sync work over plain ble_write.
#
# What it cannot do: read the answers. ESPHome does not expose notification
# subscriptions to YAML - that needs a small custom component. Battery and
# state stay in the Home Assistant integration.
#
# NOTE: the mower accepts only one BLE connection. While this ESP is connected
# the HA proxy cannot reach it. Use either this file or the HA integration.

substitutions:
  name: freelexo
  friendly_name: Freelexo Mower
  mower_mac: "45:49:4E:00:40:BC"

  mower_service: "49535343-FE7D-4AE5-8FA9-9FAFD205E455"
  # Transparent RX - the mower reads from this one
  mower_characteristic: "49535343-ACA3-481C-91EC-D85E28A60318"
  # Transparent TX - notifications, only needed by a custom component
  mower_notify: "49535343-8841-43F4-A8D4-ECBE34729BB3"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  # your board reported itself as ESP32-S3 rev0.1 - keep whatever your working
  # config uses if it differs
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    mower: DEBUG
    ble_client: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${mower_mac}
    id: mower
    auto_connect: true
    on_connect:
      then:
        - logger.log:
            format: "MOWER CONNECTED"
            level: WARN
    on_disconnect:
      then:
        - logger.log:
            format: "MOWER DISCONNECTED - commands will not be sent"
            level: WARN

globals:
  - id: tx_buffer
    type: std::vector<uint8_t>
    restore_value: no

# ---------------------------------------------------------------------------
# Frame layout, verified against the official app and the mower firmware:
#
#   "DYM" | cmd + data, padded to 15 bytes | 00 16 06 01 FF 0A   = 24 bytes
#
# p1..p6 are the data bytes, -1 means "unused". Because -1 is the sentinel a
# data byte can never be 0xFF; no current command needs that.
# ---------------------------------------------------------------------------
script:
  - id: send_frame
    mode: queued
    parameters:
      cmd: int
      p1: int
      p2: int
      p3: int
      p4: int
      p5: int
      p6: int
    then:
      - lambda: |-
          std::vector<uint8_t> f;
          f.push_back(0x44);                  // 'D'
          f.push_back(0x59);                  // 'Y'
          f.push_back(0x4D);                  // 'M'
          f.push_back((uint8_t) cmd);

          const int vals[6] = {p1, p2, p3, p4, p5, p6};
          for (int v : vals) {
            if (v >= 0) f.push_back((uint8_t) v);
          }
          f.resize(3 + 15, 0x00);             // pad the payload

          const uint8_t tail[6] = {0x00, 0x16, 0x06, 0x01, 0xFF, 0x0A};
          f.insert(f.end(), tail, tail + 6);  // 24 bytes total

          id(tx_buffer) = f;

          std::string hex;
          char b[5];
          for (auto c : f) {
            snprintf(b, sizeof(b), "%02X ", c);
            hex += b;
          }
          id(last_frame).publish_state(hex);
          ESP_LOGD("mower", "TX %s", hex.c_str());
      - ble_client.ble_write:
          id: mower
          service_uuid: ${mower_service}
          characteristic_uuid: ${mower_characteristic}
          value: !lambda return id(tx_buffer);
      - lambda: ESP_LOGD("mower", "frame handed to the BLE stack");

text_sensor:
  - platform: template
    name: "Last frame sent"
    id: last_frame
    icon: mdi:code-json

time:
  - platform: homeassistant
    id: homeassistant_time

button:
  # BasicControlRequest: [0x01][action]
  #   1 pause, 2 go to work, 3 go to station, 4 edge, 5 second area
  - platform: template
    name: "Go to work"
    icon: mdi:play
    on_press:
      - script.execute:
          id: send_frame
          cmd: 0x01
          p1: 0x02
          p2: -1
          p3: -1
          p4: -1
          p5: -1
          p6: -1

  - platform: template
    name: "Pause"
    icon: mdi:pause
    on_press:
      - script.execute:
          id: send_frame
          cmd: 0x01
          p1: 0x01
          p2: -1
          p3: -1
          p4: -1
          p5: -1
          p6: -1

  - platform: template
    name: "Go to station"
    icon: mdi:home-battery
    on_press:
      - script.execute:
          id: send_frame
          cmd: 0x01
          p1: 0x03
          p2: -1
          p3: -1
          p4: -1
          p5: -1
          p6: -1

  - platform: template
    name: "Edge cutting"
    icon: mdi:grass
    on_press:
      - script.execute:
          id: send_frame
          cmd: 0x01
          p1: 0x04
          p2: -1
          p3: -1
          p4: -1
          p5: -1
          p6: -1

  - platform: template
    name: "Second area mowing"
    icon: mdi:vector-square
    on_press:
      - script.execute:
          id: send_frame
          cmd: 0x01
          p1: 0x05
          p2: -1
          p3: -1
          p4: -1
          p5: -1
          p6: -1

  # SystemTimeSet (0x02): year/100, year%100, month, day, hour, minute
  - platform: template
    name: "Sync clock"
    icon: mdi:clock-check
    on_press:
      - lambda: |-
          auto t = id(homeassistant_time).now();
          if (!t.is_valid()) {
            ESP_LOGW("mower", "no valid time from Home Assistant yet");
            return;
          }
          id(send_frame).execute(
            0x02,
            (int) (t.year / 100), (int) (t.year % 100),
            (int) t.month, (int) t.day_of_month,
            (int) t.hour, (int) t.minute);

  - platform: restart
    name: "Restart"
    icon: mdi:restart

interval:
  # once a day - the mower has no reliable RTC backup supply and boots at
  # 2020-05-16 17:42:55 after every power loss
  - interval: 24h
    then:
      - lambda: |-
          auto t = id(homeassistant_time).now();
          if (!t.is_valid()) return;
          id(send_frame).execute(
            0x02,
            (int) (t.year / 100), (int) (t.year % 100),
            (int) t.month, (int) t.day_of_month,
            (int) t.hour, (int) t.minute);
